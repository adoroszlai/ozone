name: flaky-test-check
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git Ref (Branch/Commit_ID/Tag)
        default: master
        required: true
      test-class:
        description: Test Class
        default: NA
        required: true
      test-name:
        description: Test Name
        default:  ALL
        required: false
      submodule:
        description: Submodule
        default: 'ozone-integration-test'
        required: true
      iterations:
        description: Number of Iterations per split
        default: 10
        required: true
      splits:
        description: Number of splits
        default: 10
        required: true
      fail-fast:
        description: Stop after first failure
        default: false
        required: true
      ratis-repo:
        description: Ratis repository
        default: ''
        required: false
      ratis-ref:
        description: Ratis ref (branch, tag or commit SHA)
        default: ''
        required: false
      java-version:
        description: Java version to use
        default: '25'
        required: true
env:
  # BUILD_ARGS, MAVEN_ARGS, MAVEN_OPTS  are duplicated in several workflows, please keep in sync
  BUILD_ARGS: "-Dmaven.javadoc.skip=true -Drocks_tools_native"
  MAVEN_ARGS: --batch-mode --settings ${{ github.workspace }}/dev-support/ci/maven-settings.xml -Ddevelocity.user.config=${{ github.workspace }}/.mvn/develocity-asf.xml
  MAVEN_OPTS: -Daether.connector.http.connectionMaxTtl=25 -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.intervalMax=30000
  TEST_CLASS: ${{ github.event.inputs.test-class}}
  TEST_METHOD: ${{ github.event.inputs.test-name }}
  ITERATIONS: ${{ github.event.inputs.iterations }}
  FAIL_FAST: ${{ github.event.inputs.fail-fast }}
  RATIS_REPO: ${{ github.event.inputs.ratis-repo }}
  RATIS_VERSION: ${{ github.event.inputs.ratis-ref }}
  JAVA_VERSION: ${{ github.event.inputs.java-version }}
  SPLITS: ${{ github.event.inputs.splits }}
  SUBMODULE: ${{ github.event.inputs.submodule }}
  # Surefire 3.0.0-M4 is used because newer versions do not reliably kill the fork on timeout
  # SUREFIRE-1722, SUREFIRE-1815
  SUREFIRE_VERSION: 3.0.0-M4
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}#{1}[{2}]-{3}x{4}-java{5}', inputs.test-class, inputs.test-name, inputs.ref, inputs.splits, inputs.iterations, inputs.java-version) || '' }}
permissions: { }
jobs:
  prepare-job:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{steps.generate.outputs.matrix}}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref }}
      - id: generate
        name: Generate test matrix
        run: |
          splits=()
          for ((i = 1; i <= $SPLITS; i++)); do
            splits+=("$i")
          done
          printf -v x "%s," "${splits[@]}"
          split_matrix="[${x%,}]"
          echo "matrix=$split_matrix" >> $GITHUB_OUTPUT
  ratis:
    uses: $/.github/workflows/build-ratis.yml
    if: ${{ github.event.inputs.ratis-ref != '' }}
    with:
      repo: ${{ github.event.inputs.ratis-repo || format('{0}/ratis', github.repository_owner) }}
      ref: ${{ github.event.inputs.ratis-ref }}
  build:
    if: ${{ !cancelled() }}
    needs:
      - prepare-job
      - ratis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Setup java
        uses: $/.github/actions/setup-java-with-cache
        with:
          java-version: ${{ github.event.inputs.java-version }}
      - name: Build (most) of Ozone
        uses: $/.github/actions/build-ozone
        with:
          ratis-args: ${{ needs.ratis.outputs.build-args }}
          script-args: -DskipShade -am -pl :$SUBMODULE
          with-recon: false
  run-test:
    if: ${{ !cancelled() }}
    needs:
      - prepare-job
      - ratis
      - build
    name: Run-Split
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        split: ${{fromJson(needs.prepare-job.outputs.matrix)}}  # Define  splits
      fail-fast: ${{ fromJson(github.event.inputs.fail-fast) }}
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup java
        uses: $/.github/actions/setup-java-with-cache
        with:
          java-version: ${{ github.event.inputs.java-version }}

      - name: Execute tests
        uses: $/.github/actions/run-check
        with:
          artifact-name: flaky-${{ github.run_number }}-${{ github.run_id }}-split-${{ matrix.split }}
          ratis-args: ${{ needs.ratis.outputs.build-args }}
          script: flaky
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.OZONE_DEVELOCITY_ACCESS_KEY }}
          OZONE_REPO_CACHED: ${{ steps.download-ozone-repo.outputs.download-path != '' }}

  count-failures:
    if: ${{ failure() }}
    needs: run-test
    runs-on: ubuntu-slim
    steps:
      - name: Download build results
        uses: actions/download-artifact@v8
      - name: Count failures
        run: |
          failures=$(find . -name 'summary.txt' | grep --text -v 'iteration' | xargs grep --text -v 'exit code: 0' | wc -l)
          echo "Total failures: $failures"
          if [[ $failures -gt 0 ]]; then
            echo ""
            echo "Failed runs:"
            grep --text 'exit code: 1' */summary.txt | grep --text -o 'split.*teration [0-9]*' | sed -e 's/.summary.txt:/ /' -e 's/-/ /' | sort -g -k2 -k4
            echo ""
            exit 1
          fi
