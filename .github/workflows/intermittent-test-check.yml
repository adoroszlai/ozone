name: flaky-test-check
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git Ref (Branch/Commit_ID/Tag)
        default: master
        required: true
      test-class:
        description: Test Class
        default: NA
        required: true
      test-name:
        description: Test Name
        default:  ALL
        required: false
      submodule:
        description: Submodule
        default: 'ozone-integration-test'
        required: true
      iterations:
        description: Number of Iterations per split
        default: 10
        required: true
      splits:
        description: Number of splits
        default: 10
        required: true
      fail-fast:
        description: Stop after first failure
        default: false
        required: true
      ratis-repo:
        description: Ratis repository
        default: ''
        required: false
      ratis-ref:
        description: Ratis ref (branch, tag or commit SHA)
        default: ''
        required: false
      java-version:
        description: Java version to use
        default: '21'
        required: true
env:
  BUILD_ARGS: "-DskipRecon -DskipShade -Dmaven.javadoc.skip=true -Drocks_tools_native"
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3
  TEST_CLASS: ${{ github.event.inputs.test-class}}
  TEST_METHOD: ${{ github.event.inputs.test-name }}
  FAIL_FAST: ${{ github.event.inputs.fail-fast }}
  SPLITS: ${{ github.event.inputs.splits }}
  SUBMODULE: ${{ github.event.inputs.submodule }}
  # Surefire 3.0.0-M4 is used because newer versions do not reliably kill the fork on timeout
  # SUREFIRE-1722, SUREFIRE-1815
  SUREFIRE_VERSION: 3.0.0-M4
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}#{1}[{2}]-{3}x{4}-java{5}', inputs.test-class, inputs.test-name, inputs.ref, inputs.splits, inputs.iterations, inputs.java-version) || '' }}
permissions: { }
jobs:
  prepare-job:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{steps.generate.outputs.matrix}}
      build-args: ${{ env.BUILD_ARGS }} -am -pl :${{ env.SUBMODULE }}
      test-args: ${{ env.BUILD_ARGS }} -pl :${{ env.SUBMODULE }}
      test-filter: ${{ steps.generate.outputs.test-filter }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref }}
      - id: generate
        name: Generate test matrix
        run: |
          splits=()
          for ((i = 1; i <= $SPLITS; i++)); do
            splits+=("$i")
          done
          printf -v x "%s," "${splits[@]}"
          split_matrix="[${x%,}]"
          echo "matrix=$split_matrix" >> $GITHUB_OUTPUT

          filter="$TEST_CLASS"
          if [[ -n "$TEST_METHOD" ]] && [[ "$TEST_METHOD" != "ALL" ]]; then
            filter="$filter#$TEST_METHOD"
          fi
          echo test-filter=$filter >> "$GITHUB_OUTPUT"
  ratis:
    uses: ./.github/workflows/build-ratis.yml
    if: ${{ github.event.inputs.ratis-ref != '' }}
    with:
      repo: ${{ github.event.inputs.ratis-repo || format('{0}/ratis', github.repository_owner) }}
      ref: ${{ github.event.inputs.ratis-ref }}
  build:
    if: ${{ !cancelled() }}
    needs:
      - prepare-job
      - ratis
    uses: ./.github/workflows/check.yml
    with:
      java-version: ${{ github.event.inputs.java-version }}
      ratis-args: ${{ needs.ratis.outputs.build-args }}
      script: build
      script-args: ${{ needs.prepare-job.outputs.build-args }}
      sha: ${{ github.event.inputs.ref }}
      timeout-minutes: 60
      with-coverage: false
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  run-test:
    if: ${{ !cancelled() }}
    needs:
      - prepare-job
      - ratis
      - build
    strategy:
      matrix:
        split: ${{fromJson(needs.prepare-job.outputs.matrix)}}  # Define  splits
      fail-fast: ${{ fromJson(github.event.inputs.fail-fast) }}
    uses: ./.github/workflows/check.yml
    with:
      artifact-name: result-${{ github.run_number }}-${{ github.run_id }}-split-${{ matrix.split }}
      display-name: Run-Split (${{ matrix.split }})
      java-version: ${{ github.event.inputs.java-version }}
      needs-ozone-repo: true
      post-success: rm -fr target/junit # upload logs only for failed runs
      ratis-args: ${{ needs.ratis.outputs.build-args }}
      script: junit
      script-args: ${{ needs.prepare-job.outputs.test-args }} -Dtest=${{ needs.prepare-job.outputs.test-filter }},Abstract*Test*\$* -DexcludedGroups=slow|unhealthy
      sha: ${{ github.event.inputs.ref }}
      split: ${{ matrix.split }}
      test-iterations: ${{ github.event.inputs.iterations }}
      timeout-minutes: 360
      with-coverage: false
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  count-failures:
    if: ${{ failure() }}
    needs: run-test
    runs-on: ubuntu-slim
    steps:
      - name: Download build results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Count failures
        run: |
          failures=$(find . -name 'summary.txt' | grep --text -v 'iteration' | xargs grep --text -v 'exit code: 0' | wc -l)
          echo "Total failures: $failures"
          if [[ $failures -gt 0 ]]; then
            echo ""
            echo "Failed runs:"
            grep --text 'exit code: 1' */summary.txt | grep --text -o 'split.*teration [0-9]*' | sed -e 's/.summary.txt:/ /' -e 's/-/ /' | sort -g -k2 -k4
            echo ""
            exit 1
          fi
