on:
  workflow_call:
    inputs:
      sha:
        type: string
        description: "Commit SHA to test"
        required: true
      ratis-args:
        type: string
        description: "Version overrides from custom Ratis build (default: none)"
        default: ''
        required: false
    secrets:
      DEVELOCITY_ACCESS_KEY:
        description: 'Token for submitting build scan to Develocity'
        required: false

permissions: { }

jobs:
  build-info:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.suites.outputs.versions }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - name: Suites
        id: suites
        run: |
          dev-support/ci/acceptance_suites.sh

  test:
    uses: $/.github/workflows/check.yml
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    with:
      needs-ozone-binary-tarball: true
      ratis-args: ${{ inputs.ratis-args }}
      runner: ubuntu-24.04
      script: acceptance
      script-args: xcompat/test-old.sh ${{ matrix.version }}
      sha: ${{ inputs.sha }}
      split: compat-old-${{ matrix.version }}
      timeout-minutes: 30
      with-coverage: ${{ github.event_name != 'pull_request' }}
    strategy:
      matrix:
        version: ${{ fromJson(needs.build-info.outputs.versions) }}
      fail-fast: false
      max-parallel: 3
