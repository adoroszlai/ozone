name: build-branch
on:
  push:
permissions:
  contents: read
jobs:
  javadoc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: Cache for Maven dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository/*/*/*
            !~/.m2/repository/org/apache/ozone
          key: maven-repo-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-repo-
      - name: Build
        run: |
          ./hadoop-ozone/dev-support/checks/build.sh -Dscan=false -DskipRecon -DskipShade -Djacoco.skip -Dmaven.javadoc.skip
      - name: Populate cache
        run: |
          ./hadoop-ozone/dev-support/checks/javadoc.sh --debug -Dscan=false
          mv target/javadoc/output.log run1.log
      - name: Test cache
        run: |
          ./hadoop-ozone/dev-support/checks/javadoc.sh --debug -Dscan=false
          mv target/javadoc/output.log run2.log
      - name: Archive results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cacheable
          path: run*log
