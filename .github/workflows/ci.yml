name: full-ci
on:
  workflow_call:
    inputs:
      ratis_args:
        type: string
        description: Version overrides from custom Ratis build
        default: ''
        required: false
      ref:
        type: string
        description: Ozone ref (branch, tag or commit SHA)
        default: ''
        required: false
    secrets:
      DEVELOCITY_ACCESS_KEY:
        description: 'Token for submitting build scan to Develocity'
        required: false
      OZONE_WEBSITE_BUILD:
        description: 'Token for publishing to apache/ozone-site'
        required: false
      SONARCLOUD_TOKEN:
        description: 'Token for submitting coverage data to SonarCloud'
        required: false

env:
  # BUILD_ARGS, MAVEN_ARGS, MAVEN_OPTS and JAVA_VERSION are duplicated in several workflows, please keep in sync
  BUILD_ARGS: "-Dmaven.javadoc.skip=true -Drocks_tools_native"
  JAVA_VERSION: 25 # JDK version used by CI build and tests; should match the JDK version in apache/ozone-runner image
  MAVEN_ARGS: --batch-mode --settings ${{ github.workspace }}/dev-support/ci/maven-settings.xml -Ddevelocity.user.config=${{ github.workspace }}/.mvn/develocity-asf.xml
  MAVEN_OPTS: -Daether.connector.http.connectionMaxTtl=25 -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.intervalMax=30000
  OZONE_WITH_COVERAGE: ${{ github.event_name != 'pull_request' }}
  HADOOP_IMAGE: ghcr.io/apache/hadoop
  OZONE_IMAGE: ghcr.io/apache/ozone
  OZONE_RUNNER_IMAGE: ghcr.io/apache/ozone-runner
  OZONE_VOLUME_OWNER: 1000
  RANGER_IMAGE: ghcr.io/apache/ranger
  SPARK_SQL_IMAGE: ghcr.io/apache/spark-docker/spark

permissions: { }

jobs:
  build-info:
    runs-on: ubuntu-slim
    env:
      GITHUB_CONTEXT: ${{ toJson(github) }}
    outputs:
      acceptance-suites: ${{ steps.acceptance-suites.outputs.suites }}
      acceptance-versions: ${{ steps.acceptance-suites.outputs.versions }}
      basic-checks: ${{ steps.categorize-basic-checks.outputs.basic-checks }}
      integration-suites: ${{ steps.integration-suites.outputs.suites }}
      junit-modules: ${{ steps.junit-modules.outputs.modules }}
      kubernetes-suites: ${{ steps.kubernetes-suites.outputs.suites }}
      needs-basic-check: ${{ steps.categorize-basic-checks.outputs.needs-basic-check }}
      needs-build: ${{ steps.selective-checks.outputs.needs-build }}
      needs-compile: ${{ steps.selective-checks.outputs.needs-compile }}
      needs-compose-tests: ${{ steps.selective-checks.outputs.needs-compose-tests }}
      needs-integration-tests: ${{ steps.selective-checks.outputs.needs-integration-tests }}
      needs-kubernetes-tests: ${{ steps.selective-checks.outputs.needs-kubernetes-tests }}
      sha: ${{ steps.get-sha.outputs.sha }}
      test-classes: ${{ steps.selective-checks.outputs.test-classes }}
    steps:
      - name: "Checkout ${{ github.ref }} / ${{ github.sha }} (${{ github.event_name }})"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        if: github.event_name != 'pull_request' && inputs.ref == ''
      - name: "Checkout ${{ github.sha }} with its parent (pull request)"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
        if: github.event_name == 'pull_request'
      - name: "Checkout ${{ inputs.ref }} given in workflow input (${{ github.event_name }})"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
        if: github.event_name != 'pull_request' && inputs.ref != ''
      - name: Get SHA
        id: get-sha
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            sha="$(git rev-parse --verify HEAD)"
          else
            sha="${GITHUB_SHA}"
          fi
          echo "sha=$sha" >> $GITHUB_OUTPUT
      - name: Selective checks
        id: selective-checks
        env:
          PR_LABELS: "${{ toJSON(github.event.pull_request.labels.*.name) }}"
          PR_DRAFT: "${{ github.event.pull_request.draft }}"
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # Run selective checks
            dev-support/ci/selective_ci_checks.sh "${GITHUB_SHA}"
          else
            # Run all checks
            dev-support/ci/selective_ci_checks.sh
          fi
      - name: Acceptance suites
        id: acceptance-suites
        run: dev-support/ci/acceptance_suites.sh
      - name: Integration suites
        id: integration-suites
        run: dev-support/ci/integration_suites.sh
      - name: Modules with Java tests
        id: junit-modules
        run: dev-support/ci/junit_modules.sh
      - name: Kubernetes suites
        id: kubernetes-suites
        run: dev-support/ci/kubernetes_suites.sh
      - name: Categorize Basic Checks
        id: categorize-basic-checks
        env:
          ALL_BASIC_CHECKS: "${{ steps.selective-checks.outputs.basic-checks }}"
        run: dev-support/ci/categorize_basic_checks.sh

  build:
    needs:
      - build-info
    if: needs.build-info.outputs.needs-build == 'true' || needs.build-info.outputs.needs-integration-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Build Ozone
        uses: $/.github/actions/build-ozone
        with:
          ratis-args: ${{ inputs.ratis_args }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

  generate-config-doc:
    needs:
      - build-info
      - build
    uses: $/.github/workflows/generate-config-doc.yml
    with:
      sha: ${{ needs.build-info.outputs.sha }}

  update-ozone-site-config-doc:
    needs:
      - generate-config-doc
    if: |
      github.event_name != 'pull_request' &&
      github.repository == 'apache/ozone' &&
      github.ref_name == 'master'
    uses: $/.github/workflows/update-ozone-site-config-doc.yml
    permissions:
      contents: read
    secrets:
      OZONE_WEBSITE_BUILD: ${{ secrets.OZONE_WEBSITE_BUILD }}

  compile:
    needs:
      - build-info
      - build
      - basic
      - dependency
      - license
    if: needs.build-info.outputs.needs-compile == 'true'
    strategy:
      matrix:
        java: [ 25 ]
        include:
          - os: ubuntu-24.04
          - java: 21
            os: ${{ github.event_name == 'push' && 'ubuntu-24.04' || 'macos-15' }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          use-source-tarball: true

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache
        with:
          java-version: ${{ matrix.java }}

      - name: Compile Ozone for Java release ${{ matrix.java }}
        uses: $/.github/actions/run-check
        with:
          artifact-name: ${{ github.job }}-${{ matrix.java }}
          ratis-args: ${{ inputs.ratis_args }}
          script: compile
          script-args: "-Pdist -DskipRecon -Dmaven.javadoc.failOnWarnings -Dozone.java.version.server=${{ matrix.java }}"
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          OZONE_WITH_COVERAGE: false

  basic:
    needs:
      - build-info
    if: needs.build-info.outputs.needs-basic-check == 'true'
    name: ${{ matrix.check }}
    runs-on: ${{ contains('author,bats', matrix.check) && 'ubuntu-slim' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}
          checkout-fetch-depth: ${{ matrix.check != 'bats' && 1 || 0 }}

      - name: Setup Java
        if: matrix.check != 'author' && matrix.check != 'bats'
        uses: $/.github/actions/setup-java-with-cache

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          ratis-args: ${{ inputs.ratis_args }}
          script: ${{ matrix.check }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    strategy:
      matrix:
        check: ${{ fromJson(needs.build-info.outputs.basic-checks) }}
        exclude:
          - check: errorprone
      fail-fast: true

  errorprone:
    needs:
      - build-info
      - build
      - basic
    if: contains(needs.build-info.outputs.basic-checks, 'errorprone')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          needs-ozone-repo: true
          ratis-args: ${{ inputs.ratis_args }}
          script: ${{ github.job }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

  dependency:
    needs:
      - build-info
      - build
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          needs-ozone-binary-tarball: true
          ratis-args: ${{ inputs.ratis_args }}
          script: ${{ github.job }}

  license:
    needs:
      - build-info
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          needs-ozone-repo: true
          ratis-args: ${{ inputs.ratis_args }}
          script: ${{ github.job }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

  javadoc:
    needs:
      - build-info
      - build
      - basic
    if: needs.build-info.outputs.needs-compile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          needs-ozone-repo: true
          ratis-args: ${{ inputs.ratis_args }}
          script: ${{ github.job }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

  repro:
    needs:
      - build-info
      - build
      - basic
      - dependency
      - license
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Rebuild Ozone
        uses: $/.github/actions/build-ozone
        with:
          ratis-args: ${{ inputs.ratis_args }}
          script: repro

      - name: Investigate differences
        if: failure()
        run: |
          hadoop-ozone/dev-support/checks/_diffoscope.sh
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

  acceptance:
    needs:
      - build-info
      - build
      - basic
      - dependency
      - license
    if: needs.build-info.outputs.needs-compose-tests == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache
        with:
          java-version: 11 # Hadoop may not work with newer Java

      - name: Get versions
        id: versions
        if: ${{ contains(inputs.split, 'test-s3a.sh') || contains(inputs.split, 'test-ranger.sh') || contains(inputs.split, 'test-sts.sh') }}
        run: |
          HADOOP_VERSION=$(mvn help:evaluate -N -Dexpression=hadoop.version -q -DforceStdout -Dscan=false)
          echo "HADOOP_VERSION=$HADOOP_VERSION" >> $GITHUB_ENV
          RANGER_VERSION=$(mvn help:evaluate -N -Dexpression=ranger.version -q -DforceStdout -Dscan=false)
          echo "RANGER_VERSION=$RANGER_VERSION" >> $GITHUB_ENV

      - name: Restore Hadoop
        id: restore-hadoop
        if: ${{ contains(inputs.split, 'test-s3a.sh') }}
        uses: apache/infrastructure-actions/stash/restore@restore/v1
        with:
          clean: true
          path: ~/.cache/ozone
          key: hadoop-${{ env.HADOOP_VERSION }}

      - name: Restore Ranger
        id: restore-ranger
        if: ${{ contains(inputs.split, 'test-ranger.sh') || contains(inputs.split, 'test-sts.sh') }}
        uses: apache/infrastructure-actions/stash/restore@restore/v1
        with:
          path: ~/.cache/ozone
          key: ranger-${{ env.RANGER_VERSION }}

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          artifact-name: ${{ github.job }}-${{ matrix.suite }}
          needs-ozone-binary-tarball: true
          ratis-args: ${{ inputs.ratis_args }}
          script: ${{ github.job }}
          script-args: ${{ matrix.suite }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    strategy:
      matrix:
        suite: ${{ fromJson(needs.build-info.outputs.acceptance-suites) }}
        exclude:
          - suite: xcompat/test-old.sh
      fail-fast: false
      max-parallel: 10

  # acceptance (compat-old), split by old Ozone version
  compat-old:
    name: acceptance (compat-old-${{ matrix.version }})
    needs:
      - build-info
      - build
      - basic
      - dependency
      - license
    if: needs.build-info.outputs.needs-compose-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          artifact-name: compat-old-${{ matrix.version }}
          needs-ozone-binary-tarball: true
          ratis-args: ${{ inputs.ratis_args }}
          script: acceptance
          script-args: xcompat/test-old.sh ${{ matrix.version }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    strategy:
      matrix:
        version: ${{ fromJson(needs.build-info.outputs.acceptance-versions) }}
      fail-fast: false
      max-parallel: 3

  kubernetes:
    needs:
      - build-info
      - build
      - basic
      - dependency
      - license
    if: needs.build-info.outputs.needs-kubernetes-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          artifact-name: ${{ github.job }}-${{ matrix.suite }}
          needs-ozone-binary-tarball: true
          ratis-args: ${{ inputs.ratis_args }}
          script: ${{ github.job }}
          script-args: ${{ matrix.suite }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    strategy:
      matrix:
        suite: ${{ fromJson(needs.build-info.outputs.kubernetes-suites) }}
      fail-fast: false
      max-parallel: 3

  # runs only ozone-integration-test, split by profiles
  integration:
    needs:
      - build-info
      - build
      - basic
      - dependency
      - license
    if: needs.build-info.outputs.needs-integration-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Set hostname
        run: |
          sudo hostname localhost

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          artifact-name: ${{ github.job }}-${{ matrix.profile }}
          needs-ozone-repo: true
          ratis-args: ${{ inputs.ratis_args }}
          script: integration
          script-args: -Ptest-${{ matrix.profile }} -Phadoop-native-lib -Drocks_tools_native
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 dev-support/ci/junit_summary.py >> "$GITHUB_STEP_SUMMARY"
        env:
          JUNIT_REPORT_URL: ${{ steps.archive.outputs.artifact-url }}
    strategy:
      matrix:
        profile: ${{ fromJson(needs.build-info.outputs.integration-suites) }}
      fail-fast: false

  # same as integration, but runs tests in specific modules instead of profiles
  junit:
    needs:
      - build-info
      - build
      - basic
      - dependency
      - license
    if: needs.build-info.outputs.needs-integration-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Set hostname
        run: |
          sudo hostname localhost

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          artifact-name: ${{ github.job }}-${{ matrix.module }}
          needs-ozone-repo: true
          ratis-args: ${{ inputs.ratis_args }}
          script: integration
          script-args: -pl :${{ matrix.module }} -Pmodule-test -Phadoop-native-lib -Drocks_tools_native
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 dev-support/ci/junit_summary.py >> "$GITHUB_STEP_SUMMARY"
        env:
          JUNIT_REPORT_URL: ${{ steps.archive.outputs.artifact-url }}
    strategy:
      matrix:
        module: ${{ fromJson(needs.build-info.outputs.junit-modules) }}
      fail-fast: false
      max-parallel: 10

  # same as integration, but runs specific tests instead of profiles
  specific-tests:
    name: integration
    needs:
      - build-info
      - build
      - basic
      - dependency
      - license
    if: |
      needs.build-info.outputs.test-classes != '' &&
      needs.build-info.outputs.needs-integration-tests != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}

      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache

      - name: Set hostname
        run: |
          sudo hostname localhost

      - name: Execute check
        uses: $/.github/actions/run-check
        with:
          needs-ozone-repo: true
          ratis-args: ${{ inputs.ratis_args }}
          script: integration
          script-args: -Phadoop-native-lib -Drocks_tools_native -DskipShade -Dtest=${{ needs.build-info.outputs.test-classes }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 dev-support/ci/junit_summary.py >> "$GITHUB_STEP_SUMMARY"
        env:
          JUNIT_REPORT_URL: ${{ steps.archive.outputs.artifact-url }}

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    needs:
      - build-info
      - acceptance
      - compat-old
      - integration
      - junit
    steps:
      - name: Checkout project
        uses: $/.github/actions/get-source
        with:
          ref: ${{ needs.build-info.outputs.sha }}
          checkout-fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: target/artifacts
      - name: Untar binaries
        run: |
          mkdir -p hadoop-ozone/dist/target
          tar xzvf target/artifacts/ozone-bin/ozone*.tar.gz -C hadoop-ozone/dist/target
      - name: Setup Java
        uses: $/.github/actions/setup-java-with-cache
      - name: Calculate combined coverage
        uses: $/.github/actions/run-check
        with:
          script: ${{ github.job }}
      - name: Upload coverage to Sonar
        run: ./hadoop-ozone/dev-support/checks/sonar.sh
        if: github.repository == 'apache/ozone'
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
