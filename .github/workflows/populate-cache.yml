# This workflow creates caches with dependencies for Ozone build and test.

name: populate-cache

on:
  push:
    branches:
      - master
      - ozone-2.1
      - ozone-2.2
    paths:
      - 'pom.xml'
      - '**/pom.xml'
      - '.github/workflows/populate-cache.yml'
      - '.mvn/extensions.xml'
  workflow_call:
  workflow_dispatch:

permissions: { }

concurrency:
  group: cache-${{ github.sha }}
  cancel-in-progress: false

env:
  # variables are duplicated from ci.yml, please keep in sync
  BUILD_ARGS: "-Pdist -Psrc -Dmaven.javadoc.skip=true -Drocks_tools_native"
  TEST_JAVA_VERSION: 25 # JDK version used by CI build and tests; should match the JDK version in apache/ozone-runner image
  MAVEN_ARGS: --batch-mode --settings ${{ github.workspace }}/dev-support/ci/maven-settings.xml -Ddevelocity.user.config=${{ github.workspace }}/.mvn/develocity-asf.xml
  MAVEN_OPTS: -Daether.connector.http.connectionMaxTtl=25 -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.intervalMax=30000
  SKIP_APACHE_VERIFY_DOWNLOAD: false

jobs:
  maven:
    runs-on: ubuntu-24.04
    outputs:
      hadoop-version: ${{ steps.versions.outputs.hadoop }}
      nodejs-version: ${{ steps.versions.outputs.nodejs }}
      ranger-version: ${{ steps.versions.outputs.ranger }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Calculate Maven cache key
        id: maven-cache-key
        run: |
          echo "MAVEN_REPO_KEY=maven-repo-${{ hashFiles('**/pom.xml', '.mvn/extensions.xml') }}" >> $GITHUB_ENV

      - name: Restore cache for Maven dependencies
        id: restore-cache
        uses: apache/infrastructure-actions/stash/restore@restore/v1
        with:
          path: ~/.m2/repository
          key: ${{ env.MAVEN_REPO_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.TEST_JAVA_VERSION }}

      - name: Get versions
        id: versions
        run: |
          source hadoop-ozone/dev-support/checks/_lib.sh
          set -e
          nodejs_version="$(get_version nodejs)"
          [[ -n "$nodejs_version" ]] && echo "nodejs=$nodejs_version" >> $GITHUB_OUTPUT
          hadoop_version="$(get_version hadoop)"
          [[ -n "$hadoop_version" ]] && echo "hadoop=$hadoop_version" >> $GITHUB_OUTPUT
          ranger_version="$(get_version ranger)"
          [[ -n "$ranger_version" ]] && echo "ranger=$ranger_version" >> $GITHUB_OUTPUT

      - name: Fetch dependencies
        if: steps.restore.outputs.stash-hit != 'true'
        run: mvn $MAVEN_ARGS --show-version dependency:go-offline dependency:resolve-plugins

      - name: Delete Ozone jars from repo
        if: steps.restore.outputs.stash-hit != 'true'
        run: rm -fr ~/.m2/repository/org/apache/ozone

      - name: List repo contents
        if: always()
        run: find ~/.m2/repository -type f | sort | xargs ls -lh

      - name: Save stash with exact key
        if: steps.restore.outputs.stash-hit != 'true'
        uses: apache/infrastructure-actions/stash/save@save/v1
        with:
          path: ~/.m2/repository
          key: ${{ env.MAVEN_REPO_KEY }}
          retention-days: 90

      - name: Save stash with generic key
        if: steps.restore.outputs.stash-hit != 'true'
        uses: apache/infrastructure-actions/stash/save@save/v1
        with:
          path: ~/.m2/repository
          key: maven-repo
          retention-days: 90

      # keep saving cache for other branches that may not have started using stash
      - name: Save cache for Maven dependencies
        if: steps.restore-cache.outputs.stash-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository/*/*/*
            !~/.m2/repository/org/apache/ozone
          key: ${{ env.MAVEN_REPO_KEY }}

  hadoop:
    needs: maven
    env:
      HADOOP_VERSION: ${{ needs.maven.outputs.hadoop-version }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            hadoop-ozone/dist/src/main

      - name: Restore
        id: restore
        uses: apache/infrastructure-actions/stash/restore@restore/v1
        with:
          clean: true
          path: ~/.cache/ozone
          key: hadoop-${{ env.HADOOP_VERSION }}

      - name: Download
        if: steps.restore.outputs.stash-hit != 'true'
        run: |
          rm -fr ~/.cache/ozone
          source hadoop-ozone/dist/src/main/compose/testlib.sh
          import_keys https://downloads.apache.org/hadoop/common/KEYS
          download_hadoop

      - name: Store
        if: steps.restore.outputs.stash-hit != 'true'
        uses: apache/infrastructure-actions/stash/save@save/v1
        with:
          path: ~/.cache/ozone
          key: hadoop-${{ env.HADOOP_VERSION }}
          retention-days: 90

  nodejs:
    needs: maven
    env:
      NODEJS_VERSION: ${{ needs.maven.outputs.nodejs-version }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            dev-support/ci/download-nodejs.sh

      - name: Restore
        id: restore
        uses: apache/infrastructure-actions/stash/restore@restore/v1
        with:
          path: ~/.m2/repository/com/github/eirslett/node
          key: nodejs-${{ env.NODEJS_VERSION }}

      - name: Download
        if: steps.restore.outputs.stash-hit != 'true'
        run: |
          dev-support/ci/download-nodejs.sh

      - name: Store
        if: steps.restore.outputs.stash-hit != 'true'
        uses: apache/infrastructure-actions/stash/save@save/v1
        with:
          path: ~/.m2/repository/com/github/eirslett/node
          key: nodejs-${{ env.NODEJS_VERSION }}
          retention-days: 90

  ranger:
    needs: maven
    env:
      RANGER_VERSION: ${{ needs.maven.outputs.ranger-version }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            hadoop-ozone/dist/src/main

      - name: Restore
        id: restore
        uses: apache/infrastructure-actions/stash/restore@restore/v1
        with:
          clean: true
          path: ~/.cache/ozone
          key: ranger-${{ env.RANGER_VERSION }}

      - name: Download
        if: steps.restore.outputs.stash-hit != 'true'
        run: |
          rm -fr ~/.cache/ozone
          source hadoop-ozone/dist/src/main/compose/testlib.sh
          import_keys https://downloads.apache.org/ranger/KEYS
          download_ranger
          download_ranger_ozone_plugin

      - name: Store
        if: steps.restore.outputs.stash-hit != 'true'
        uses: apache/infrastructure-actions/stash/save@save/v1
        with:
          path: ~/.cache/ozone
          key: ranger-${{ env.RANGER_VERSION }}
          retention-days: 90
