name: "Setup Java with Maven Cache"

inputs:
  java-version:
    description: "Java version to set up"
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup java ${{ inputs.java-version }}
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}

    - name: Cache for Maven dependencies
      id: restore-exact
      uses: apache/infrastructure-actions/stash/restore@restore/v1
      with:
        path: ~/.m2/repository
        key: maven-repo-${{ hashFiles('**/pom.xml', '.mvn/extensions.xml') }}

    - name: Fallback to other Maven cache
      if: steps.restore-exact.outputs.stash-hit != 'true'
      uses: apache/infrastructure-actions/stash/restore@restore/v1
      with:
        path: ~/.m2/repository
        key: maven-repo
