name: Get Ozone source

description: >
  Get Ozone source from Git (default) or tarball.

inputs:
  checkout-fetch-depth:
    description: >
      Optional fetch depth for Git checkout.
    default: '1'

  ref:
    description: >
      Git ref to check out (commit SHA, tag or branch name).
    default: ''

  use-source-tarball:
    description: >
      Whether to download Ozone source tarball, created by build, instead of Git.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout project
      if: ${{ inputs.use-source-tarball != 'true' }}
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.checkout-fetch-depth }}

    - name: Delete .git to omit commit SHA in build artifacts
      if: ${{ inputs.use-source-tarball != 'true' && inputs.checkout-fetch-depth == '1' }}
      shell: bash
      run: |
        rm -fr .git

    - name: Download Ozone source tarball
      if: ${{ inputs.use-source-tarball == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ozone-src

    - name: Extract source tarball
      if: ${{ inputs.use-source-tarball == 'true' }}
      shell: bash
      run: |
        tar --strip-components 1 -xzvf ozone*-src.tar.gz
