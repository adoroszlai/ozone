name: Run a CI check.

description: >
  Run a CI check from hadoop-ozone/dev-support/checks, and upload results as artifact.
  Requires sources to be present.

inputs:
  artifact-name:
    description: >
      Optional name for artifact to be uploaded.  Uses script name by default.
    default: ''

  needs-ozone-binary-tarball:
    description: >
      Optionally download Ozone binary tarball created by build.
    default: 'false'

  needs-ozone-repo:
    description: >
      Optionally download Ozone jars created by build.
    default: 'false'

  ratis-args:
    description: >
      Optional version overrides from custom Ratis build.
    default: ''

  script:
    description: >
      Build script to run from hadoop-ozone/dev-support/checks, without .sh extension.
    default: build

  script-args:
    description: >
      Arguments for the build script.
      The action appends ratis-args, if present, so script-args should omit them.
    default: ''

runs:
  using: composite
  steps:
    - name: Download Ratis repo
      if: ${{ inputs.ratis-args != '' }}
      uses: actions/download-artifact@v8
      with:
        name: ratis-jars
        path: |
          ~/.m2/repository/org/apache/ratis

    - name: Download Ozone binary tarball
      if: ${{ inputs.needs-ozone-binary-tarball == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ozone-bin

    - name: Extract binary tarball
      if: ${{ inputs.needs-ozone-binary-tarball == 'true' }}
      shell: bash
      run: |
        mkdir -p hadoop-ozone/dist/target
        tar xzvf ozone*.tar.gz -C hadoop-ozone/dist/target
        rm ozone*.tar.gz

    - name: Download Ozone repo
      if: ${{ inputs.needs-ozone-repo == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ozone-repo
        path: |
          ~/.m2/repository/org/apache/ozone

    - name: Run the check
      shell: bash
      run: |
        $COMMAND
      env:
        COMMAND: hadoop-ozone/dev-support/checks/${{ inputs.script }}.sh ${{ inputs.script-args }} ${{ inputs.ratis-args }}

    - name: Summary of failures
      if: ${{ failure() }}
      shell: bash
      run: |
        if [[ -s "target/$SCRIPT/summary.md" ]]; then
          cat target/$SCRIPT/summary.md >> $GITHUB_STEP_SUMMARY
        fi
        hadoop-ozone/dev-support/checks/_summary.sh target/$SCRIPT/summary.txt
      env:
        SCRIPT: ${{ inputs.script }}

    - name: Sanitize artifact name
      id: artifact-name
      shell: bash
      run: |
        name="${ARTIFACT:-$SCRIPT}"
        name=$(echo "$name" | sed -e 's!/!-!g' -e 's/.sh$//')
        echo "value=${name}" >> "$GITHUB_OUTPUT"
      env:
        ARTIFACT: ${{ inputs.artifact-name }}
        SCRIPT: ${{ inputs.script }}

    - name: Archive build results
      id: archive
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact-name.outputs.value }}
        # please keep path as a single item; move to that directory all files needed in the artifact
        path: target/${{ inputs.script }}
      continue-on-error: true
